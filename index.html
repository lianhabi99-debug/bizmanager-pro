<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BizManager Pro — Akhdan Nur Syafi</title>
    <link rel="stylesheet" href="bisnis.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"><span></span><span></span><span></span><span></span></div>
        <p>Loading Business Data...</p>
    </div>

    <!-- App Container -->
    <div id="app" style="display:none;">
        <!-- Top Bar -->
        <header id="topbar">
            <button id="sidebar-toggle"><i class="fas fa-bars"></i></button>
            <div class="topbar-brand" id="topbar-brand">BizManager Pro <span class="watermark">— Akhdan Nur Syafi</span></div>
            <div class="topbar-right">
                <button id="theme-toggle" title="Toggle Theme"><i class="fas fa-moon"></i></button>
                <button id="notif-btn" title="Notifications"><i class="fas fa-bell"></i><span id="notif-badge" class="badge hidden">0</span></button>
            </div>
        </header>

        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-store"></i> BizManager</h2>
            </div>
            <ul class="sidebar-nav">
                <li><a href="#" data-page="dashboard" class="active"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="#" data-page="products"><i class="fas fa-boxes"></i> Products</a></li>
                <li><a href="#" data-page="incoming"><i class="fas fa-arrow-down"></i> Incoming Stock</a></li>
                <li><a href="#" data-page="sales"><i class="fas fa-shopping-cart"></i> Sales</a></li>
                <li><a href="#" data-page="expenses"><i class="fas fa-money-bill-wave"></i> Expenses</a></li>
                <li><a href="#" data-page="capital"><i class="fas fa-coins"></i> Capital</a></li>
                <li><a href="#" data-page="reports"><i class="fas fa-file-alt"></i> Reports</a></li>
                <li><a href="#" data-page="history"><i class="fas fa-clock"></i> History</a></li>
                <li><a href="#" data-page="calendar"><i class="fas fa-calendar"></i> Calendar</a></li>
                <li><a href="#" data-page="settings"><i class="fas fa-cog"></i> Settings</a></li>
                <li><a href="#" data-page="importexport"><i class="fas fa-database"></i> Import/Export</a></li>
            </ul>
        </nav>

        <!-- Overlay for mobile -->
        <div id="sidebar-overlay"></div>

        <!-- Main Content -->
        <main id="main-content">
            <!-- Page containers -->
            <div id="page-dashboard" class="page active-page"></div>
            <div id="page-products" class="page"></div>
            <div id="page-incoming" class="page"></div>
            <div id="page-sales" class="page"></div>
            <div id="page-expenses" class="page"></div>
            <div id="page-capital" class="page"></div>
            <div id="page-reports" class="page"></div>
            <div id="page-history" class="page"></div>
            <div id="page-calendar" class="page"></div>
            <div id="page-settings" class="page"></div>
            <div id="page-importexport" class="page"></div>
        </main>

        <!-- Notification Panel -->
        <div id="notif-panel" class="hidden">
            <div class="notif-header"><h3>Notifications</h3><button id="notif-close"><i class="fas fa-times"></i></button></div>
            <div id="notif-list"></div>

        <!-- Floating Action Button -->
        <button id="fab" title="Quick Actions"><i class="fas fa-plus"></i></button>
        <div id="fab-menu" class="hidden">
            <button data-action="quick-product"><i class="fas fa-box"></i> Add Product</button>
            <button data-action="quick-sale"><i class="fas fa-cart-plus"></i> New Sale</button>
            <button data-action="quick-expense"><i class="fas fa-minus-circle"></i> Add Expense</button>
        </div>

        <!-- Toast Container -->
        <div id="toast-container"></div>

    <script src="bisnis.js"></script>
</body>
</html>
